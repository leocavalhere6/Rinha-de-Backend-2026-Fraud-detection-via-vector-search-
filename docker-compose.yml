version: '3.8'

services:
  api01:
    build: .
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: '145MB'

  api02:
    build: .
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: '145MB'

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: '50MB'
